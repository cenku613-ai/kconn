apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kconn-resume
  labels:
    app.kubernetes.io/part-of: kconn
spec:
  description: >-
    Resume a paused Kafka Connect connector. Wraps the `kconn resume` CLI command.
    Server URL and credentials are read from ConfigMap `kconn-config` and Secret `kconn-credentials`.
  params:
    - name: kconn-image
      type: string
      description: Container image for the kconn CLI
      default: "quay.io/cen_ku/kconn:latest"
    - name: output-format
      type: string
      description: "Output format: table or json"
      default: "json"
    - name: connector-name
      type: string
      description: Name of the connector to resume
  steps:
    - name: resume
      image: $(params.kconn-image)
      envFrom:
        - configMapRef:
            name: kconn-config
        - secretRef:
            name: kconn-credentials
      args:
        - resume
        - $(params.connector-name)
        - --output
        - $(params.output-format)
      env:
        - name: CI
          value: "true"
