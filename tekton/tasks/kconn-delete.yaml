apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kconn-delete
  labels:
    app.kubernetes.io/part-of: kconn
spec:
  description: >-
    Delete a Kafka Connect connector. Wraps the `kconn delete` CLI command.
    Server URL and credentials are read from ConfigMap `kconn-config` and Secret `kconn-credentials`.
  params:
    - name: kconn-image
      type: string
      description: Container image for the kconn CLI
      default: "quay.io/cen_ku/kconn:latest"
    - name: output-format
      type: string
      description: "Output format: table or json"
      default: "json"
    - name: connector-name
      type: string
      description: Name of the connector to delete
    - name: confirm
      type: string
      description: "Must be 'true' to proceed with deletion"
      default: "true"
  steps:
    - name: delete
      image: $(params.kconn-image)
      envFrom:
        - configMapRef:
            name: kconn-config
        - secretRef:
            name: kconn-credentials
      args:
        - delete
        - $(params.connector-name)
        - --output
        - $(params.output-format)
        - --yes
      env:
        - name: CI
          value: "true"
