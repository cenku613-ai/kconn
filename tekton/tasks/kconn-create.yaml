apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kconn-create
  labels:
    app.kubernetes.io/part-of: kconn
spec:
  description: >-
    Create a Kafka Connect connector from inline JSON/YAML config. Wraps the `kconn create` CLI command.
    Server URL and credentials are read from ConfigMap `kconn-config` and Secret `kconn-credentials`.
  params:
    - name: kconn-image
      type: string
      description: Container image for the kconn CLI
      default: "quay.io/cen_ku/kconn:latest"
    - name: output-format
      type: string
      description: "Output format: table or json"
      default: "json"
    - name: connector-config
      type: string
      description: Inline JSON or YAML connector configuration
    - name: connector-name
      type: string
      description: Override connector name from config
      default: ""
  results:
    - name: connector-name
      description: Name of the created connector
  steps:
    - name: write-config
      image: $(params.kconn-image)
      script: |
        #!/bin/sh
        cat > /tmp/connector-config.json << 'CONFIGEOF'
        $(params.connector-config)
        CONFIGEOF
    - name: create
      image: $(params.kconn-image)
      envFrom:
        - configMapRef:
            name: kconn-config
        - secretRef:
            name: kconn-credentials
      env:
        - name: CI
          value: "true"
      script: |
        #!/bin/sh
        ARGS="create /tmp/connector-config.json --output $(params.output-format)"
        if [ -n "$(params.connector-name)" ]; then
          ARGS="$ARGS --name $(params.connector-name)"
        fi
        node /app/dist/index.js $ARGS
    - name: save-result
      image: $(params.kconn-image)
      envFrom:
        - configMapRef:
            name: kconn-config
        - secretRef:
            name: kconn-credentials
      script: |
        #!/bin/sh
        if [ -n "$(params.connector-name)" ]; then
          echo -n "$(params.connector-name)" > $(results.connector-name.path)
        else
          cat /tmp/connector-config.json | jq -r '.name // .config.name' > $(results.connector-name.path)
        fi
