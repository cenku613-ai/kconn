apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kconn-describe
  labels:
    app.kubernetes.io/part-of: kconn
spec:
  description: >-
    Describe a Kafka Connect connector. Wraps the `kconn describe` CLI command.
    Server URL and credentials are read from ConfigMap `kconn-config` and Secret `kconn-credentials`.
  params:
    - name: kconn-image
      type: string
      description: Container image for the kconn CLI
      default: "quay.io/cen_ku/kconn:latest"
    - name: output-format
      type: string
      description: "Output format: table or json"
      default: "json"
    - name: connector-name
      type: string
      description: Name of the connector to describe
  results:
    - name: connector-info
      description: JSON object with connector details
  steps:
    - name: describe
      image: $(params.kconn-image)
      envFrom:
        - configMapRef:
            name: kconn-config
        - secretRef:
            name: kconn-credentials
      args:
        - describe
        - $(params.connector-name)
        - --output
        - $(params.output-format)
      env:
        - name: CI
          value: "true"
    - name: save-result
      image: $(params.kconn-image)
      envFrom:
        - configMapRef:
            name: kconn-config
        - secretRef:
            name: kconn-credentials
      env:
        - name: CI
          value: "true"
      script: |
        #!/bin/sh
        node /app/dist/index.js describe $(params.connector-name) \
          --output json > $(results.connector-info.path)
