{{- if .Values.kafkaConnect.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.kafkaConnect.credentialsSecret }}
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- end }}
  labels:
    app.kubernetes.io/name: kconn
    app.kubernetes.io/part-of: kconn
type: Opaque
stringData:
  KCONN_USERNAME: {{ .Values.kafkaConnect.username | quote }}
  KCONN_PASSWORD: {{ .Values.kafkaConnect.password | quote }}
{{- end }}
