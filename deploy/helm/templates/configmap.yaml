apiVersion: v1
kind: ConfigMap
metadata:
  name: kconn-config
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- end }}
  labels:
    app.kubernetes.io/name: kconn
    app.kubernetes.io/part-of: kconn
data:
  KCONN_SERVER: {{ .Values.kafkaConnect.serverUrl | quote }}
  KCONN_OUTPUT: {{ .Values.outputFormat | quote }}
