apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kconn-list
spec:
  description: List all Kafka Connect connectors
  params:
    - name: kconn-image
      type: string
      default: "quay.io/cen_ku/kconn:latest"
    - name: output-format
      type: string
      default: "json"
    - name: expand
      type: string
      default: "false"
    - name: state-filter
      type: string
      default: ""
  results:
    - name: connectors
      description: JSON array of connector names
  steps:
    - name: list
      image: $(params.kconn-image)
      envFrom:
        - configMapRef:
            name: kconn-config
        - secretRef:
            name: kconn-credentials
      env:
        - name: CI
          value: "true"
      script: |
        #!/bin/sh
        ARGS="list --output $(params.output-format) --expand=$(params.expand)"
        if [ -n "$(params.state-filter)" ]; then
          ARGS="$ARGS --state $(params.state-filter)"
        fi
        node /app/dist/index.js $ARGS
    - name: save-result
      image: $(params.kconn-image)
      envFrom:
        - configMapRef:
            name: kconn-config
        - secretRef:
            name: kconn-credentials
      env:
        - name: CI
          value: "true"
      script: |
        #!/bin/sh
        ARGS="list --output json"
        if [ -n "$(params.state-filter)" ]; then
          ARGS="$ARGS --state $(params.state-filter)"
        fi
        node /app/dist/index.js $ARGS | jq -r '.[].name // .[] | if type == "object" then .name else . end' | jq -R -s -c 'split("\n") | map(select(. != ""))' > $(results.connectors.path)
---
