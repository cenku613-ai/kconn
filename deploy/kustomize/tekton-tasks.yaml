apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kconn-create
spec:
  description: Create a connector from inline config
  params:
    - name: kconn-image
      type: string
      default: "quay.io/cen_ku/kconn:latest"
    - name: output-format
      type: string
      default: "json"
    - name: connector-config
      type: string
    - name: connector-name
      type: string
      default: ""
  results:
    - name: connector-name
      description: Name of the created connector
  steps:
    - name: write-config
      image: $(params.kconn-image)
      script: |
        #!/bin/sh
        echo '$(params.connector-config)' > /tmp/connector-config.json
    - name: create
      image: $(params.kconn-image)
      envFrom:
        - configMapRef:
            name: kconn-config
        - secretRef:
            name: kconn-credentials
      env:
        - name: CI
          value: "true"
      script: |
        #!/bin/sh
        ARGS="create /tmp/connector-config.json --output $(params.output-format)"
        if [ -n "$(params.connector-name)" ]; then
          ARGS="$ARGS --name $(params.connector-name)"
        fi
        node /app/dist/index.js $ARGS
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kconn-update
spec:
  description: Update connector config
  params:
    - name: kconn-image
      type: string
      default: "quay.io/cen_ku/kconn:latest"
    - name: output-format
      type: string
      default: "json"
    - name: connector-name
      type: string
    - name: config-changes
      type: string
  steps:
    - name: write-config
      image: $(params.kconn-image)
      script: |
        #!/bin/sh
        echo '$(params.config-changes)' > /tmp/config-changes.json
    - name: update
      image: $(params.kconn-image)
      envFrom:
        - configMapRef:
            name: kconn-config
        - secretRef:
            name: kconn-credentials
      args:
        - update
        - $(params.connector-name)
        - --output
        - $(params.output-format)
        - --file
        - /tmp/config-changes.json
      env:
        - name: CI
          value: "true"
---
