      envFrom:
        - configMapRef:
            name: kconn-config
        - secretRef:
            name: kconn-credentials
      args:
        - describe
        - $(params.connector-name)
        - --output
        - $(params.output-format)
      env:
        - name: CI
          value: "true"
---
