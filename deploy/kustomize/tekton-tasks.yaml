apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kconn-restart
spec:
  description: Restart a connector
  params:
    - name: kconn-image
      type: string
      default: "quay.io/cen_ku/kconn:latest"
    - name: output-format
      type: string
      default: "json"
    - name: connector-name
      type: string
    - name: include-tasks
      type: string
      default: "false"
    - name: only-failed
      type: string
      default: "false"
    - name: delay-ms
      type: string
      default: "0"
  steps:
    - name: restart
      image: $(params.kconn-image)
      envFrom:
        - configMapRef:
            name: kconn-config
        - secretRef:
            name: kconn-credentials
      env:
        - name: CI
          value: "true"
      script: |
        #!/bin/sh
        ARGS="restart $(params.connector-name) --output $(params.output-format)"
        if [ "$(params.include-tasks)" = "true" ]; then
          ARGS="$ARGS --include-tasks"
        fi
        if [ "$(params.only-failed)" = "true" ]; then
          ARGS="$ARGS --only-failed"
        fi
        if [ "$(params.delay-ms)" != "0" ]; then
          ARGS="$ARGS --delay $(params.delay-ms)"
        fi
        node /app/dist/index.js $ARGS
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kconn-offsets
spec:
  description: Get or reset connector offsets
  params:
    - name: kconn-image
      type: string
      default: "quay.io/cen_ku/kconn:latest"
    - name: output-format
      type: string
      default: "json"
    - name: connector-name
      type: string
    - name: action
      type: string
      default: "get"
  results:
    - name: offsets
      description: JSON object with connector offsets
  steps:
    - name: offsets
      image: $(params.kconn-image)
      envFrom:
        - configMapRef:
            name: kconn-config
        - secretRef:
            name: kconn-credentials
      env:
        - name: CI
          value: "true"
      script: |
        #!/bin/sh
        if [ "$(params.action)" = "reset" ]; then
          node /app/dist/index.js offsets-reset $(params.connector-name) \
            --output $(params.output-format) --yes
        else
          node /app/dist/index.js offsets $(params.connector-name) \
            --output $(params.output-format)
        fi
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kconn-validate
spec:
  description: Validate connector config against a plugin
  params:
    - name: kconn-image
      type: string
      default: "quay.io/cen_ku/kconn:latest"
    - name: output-format
      type: string
      default: "json"
    - name: connector-class
      type: string
    - name: connector-config
      type: string
      default: "{}"
  results:
    - name: validation-result
      description: JSON object with validation results
  steps:
    - name: write-config
      image: $(params.kconn-image)
      script: |
        #!/bin/sh
        echo '$(params.connector-config)' > /tmp/validate-config.json
    - name: validate
      image: $(params.kconn-image)
      envFrom:
        - configMapRef:
            name: kconn-config
        - secretRef:
            name: kconn-credentials
      args:
        - validate
        - $(params.connector-class)
        - --output
        - $(params.output-format)
        - --config
        - /tmp/validate-config.json
      env:
        - name: CI
          value: "true"
